# rag_service/docker-compose.yml
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragdb"]
      interval: 5s
      retries: 10

  # ── GPU 서버 전용 (NVIDIA CC 8.0+, VRAM 8GB+) ─────────────────────────────
  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest
    ports: ["8001:8000"]
    volumes: ["vllm_models:/root/.cache/huggingface"]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      --dtype auto
      --max-model-len 8192
      --gpu-memory-utilization 0.85
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 10s
      retries: 20
      start_period: 60s

  # ── CPU 전용 vLLM (GPU 없는 로컬 / CI 환경) ───────────────────────────────
  vllm-cpu:
    profiles: ["vllm-cpu"]
    image: vllm/vllm-openai:v0.4.3-cpu
    ports: ["8001:8000"]
    volumes: ["vllm_models:/root/.cache/huggingface"]
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}
      --dtype float32
      --device cpu
      --max-model-len 4096
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      retries: 20
      start_period: 120s

  # ── Ollama GPU (NVIDIA GTX/RTX, VRAM 4GB+) ───────────────────────────────
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_models:/root/.ollama"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      retries: 20
      start_period: 30s

  ollama-init:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes: ["ollama_models:/root/.ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama pull ${OLLAMA_MODEL:-gemma4:e4b-it-q4_K_M}
        ollama pull ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large}

  # ── Ollama CPU-only (GPU 없는 로컬 환경) ─────────────────────────────────
  ollama-cpu:
    profiles: ["ollama-cpu"]
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_models:/root/.ollama"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      retries: 20
      start_period: 30s

  ollama-cpu-init:
    profiles: ["ollama-cpu"]
    image: ollama/ollama:latest
    volumes: ["ollama_models:/root/.ollama"]
    depends_on:
      ollama-cpu:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama-cpu:11434
    entrypoint:
      - /bin/sh
      - -c
      - |
        ollama pull ${OLLAMA_MODEL:-gemma4:e4b-it-q4_K_M}
        ollama pull ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large}

  # ── RAG API 서비스 ────────────────────────────────────────────────────────
  api:
    build: .
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
  vllm_models:
  ollama_models:
